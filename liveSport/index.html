<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.9.6/controls.css">
    <link rel="stylesheet" href="/css/root.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/tv.css">

    <link rel="stylesheet" href="/css/program.css">
    <link rel="stylesheet" href="/liveSport/style.css">



</head>

<body>

    <!-- === HEADER === -->
    <header id="header"> </header>

    <!-- === CONTENT === -->
    <main class="main-content">

        <div id="tv-show">
            <div id="tv-show__live" data-shaka-player-container>
                <video id="myVideo" data-shaka-player style="width:100%; height:100%;"></video>
                <div class="yt-watermark"></div>

            </div>
        </div>
        
<div class="live-container" id="live-container">
</div>

        <div class="container" id="container">
            <div class="resolution-bar" id="resolution-bar"></div>
        </div>


    </main>
    <!-- === FOOTER === -->
    <footer id="footer"> </footer>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.9.6/shaka-player.compiled.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.9.6/shaka-player.ui.js"></script>

    <script src="/javaScript/index.js"></script>
    <script src="/javaScript/tv.js"></script>
    <script src="/javaScript/layout.js" defer></script>
    <script src="/liveSport/index.js"></script>
</body>

</html>
